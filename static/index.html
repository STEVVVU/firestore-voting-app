<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>TABS v SPACES</title><link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/materialize/1.0.0/css/materialize.min.css"></head>
<body class="yellow lighten-5"><nav class="teal darken-3"><div class="nav-wrapper container"><span class="brand-logo center">TABS v SPACES</span><button class="btn" id="login">Sign in with Google</button><button class="btn" id="logout" hidden>Sign out</button></div></nav>
<main class="section"><h4 class="center">Choose a side</h4><p id="identity" class="center"></p><p id="status" class="center" role="status"></p><div class="row center"><section class="col s6 m5 offset-m1"><div id="tabs-panel" class="card-panel"><span class="vote-icon" aria-hidden="true">》</span><h3><span id="tabs-count">0</span> votes</h3><button class="btn" id="tabs" disabled>Vote for TABS</button></div></section><section class="col s6 m5"><div id="spaces-panel" class="card-panel"><span class="vote-icon" aria-hidden="true">⎵</span><h3><span id="spaces-count">0</span> votes</h3><button class="btn" id="spaces" disabled>Vote for SPACES</button></div></section></div><h4 class="header center">Recent Votes</h4><ul id="recent" class="container collection center"></ul></main><script type="module" src="/static/app.js"></script><style>.vote-icon{font-size:6rem;line-height:1}.nav-wrapper button{position:relative;z-index:1} [hidden]{display:none!important}@media(max-width:600px){.brand-logo.center{font-size:1.2rem;left:auto;right:0;transform:none}.nav-wrapper button{font-size:.65rem;padding:0 .5rem}.vote-icon{font-size:3rem}h3{font-size:2rem}}</style></body></html>
